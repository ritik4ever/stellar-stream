name: Accessibility Audit (axe-core)

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  axe-scan:
    name: WCAG 2.1 AA audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install axe-core scanning tools
        run: npm install --no-save serve playwright @axe-core/playwright

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Serve production build
        run: |
          npx serve -s dist -p 4173 &
          for i in $(seq 1 30); do
            curl --silent --fail http://localhost:4173 >/dev/null && break
            sleep 1
          done

      - name: Run axe-core accessibility scan
        run: node scripts/a11y-scan.mjs
        env:
          A11Y_BASE_URL: http://localhost:4173

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: frontend/a11y-report/