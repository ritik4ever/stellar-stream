name: Backend CI

permissions:
  contents: read

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

env:
  CI_OUTCOME: ${{ github.event_name == 'pull_request' && 'pending' || 'success' }}

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        id: unit-tests
        continue-on-error: true
        run: npx vitest run --coverage --coverage.thresholds.lines=80 --coverage.thresholds.branches=80

      - name: Classify test outcome
        id: classify
        if: always()
        run: |
          if [ "${{ steps.unit-tests.outcome }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.unit-tests.outcome }}" = "failure" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "status=transient" >> "$GITHUB_OUTPUT"
          else
            echo "status=blocked" >> "$GITHUB_OUTPUT"
          fi

      - name: Record outcome signal
        if: always()
        run: |
          echo "backend-ci outcome: ${{ steps.classify.outputs.status }}"
          echo "owner action: see docs/runbooks/backend-ci.md"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/

      - name: Fail on blocked outcome
        if: steps.classify.outputs.status == 'blocked'
        run: exit 1
