name: Soroban Contract CI

on:
  push:
    paths:
      - "contracts/**"
      - ".github/workflows/contract-ci.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contract-ci.yml"

jobs:
  contract-test:
    name: Build and test Soroban contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # No explicit toolchain input: the pin in contracts/rust-toolchain.toml
        # (nightly-2024-12-01) is the source of truth. Keep in sync with
        # contract-smoke.yml and bindings-drift.yml.
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check contract formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (contracts)
        working-directory: contracts
        run: |
          cargo audit --json > cargo-audit-report.json || true
          cargo audit

      - name: Upload cargo audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: contracts/cargo-audit-report.json
          retention-days: 30

      - name: Run contract tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --locked

      - name: Install Soroban CLI
        # Pinned to the soroban-sdk major used in contracts/Cargo.toml so the
        # CI build uses the same toolchain as scripts/deploy.sh.
        run: cargo install --locked soroban-cli --version 21.0.0

      - name: Build WASM binary and report size
        run: |
          soroban contract build
          WASM_FILE="target/wasm32v1-none/release/stellar_stream.wasm"
          if [ ! -f "$WASM_FILE" ]; then
            WASM_FILE="target/wasm32-unknown-unknown/release/stellar_stream.wasm"
          fi
          SIZE=$(wc -c < "$WASM_FILE")
          echo "WASM Binary Size: ${SIZE} bytes ($(numfmt --to=iec ${SIZE})) ($WASM_FILE)"
          echo "## WASM Binary Size" >> $GITHUB_STEP_SUMMARY
          echo "**$(numfmt --to=iec ${SIZE})** (${SIZE} bytes)" >> $GITHUB_STEP_SUMMARY