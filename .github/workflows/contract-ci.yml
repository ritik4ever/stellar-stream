name: Soroban Contract CI

on:
  push:
    paths:
      - "contracts/**"
      - "scripts/generate-contract-bindings.sh"
      - "scripts/test-generate-contract-bindings.sh"
      - ".github/workflows/contract-ci.yml"
      - ".github/workflows/bindings-drift.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contract-ci.yml"

jobs:
  contract-test:
    name: Build and test Soroban contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate contract build configuration
        env:
          EXPECTED_TOOLCHAIN: nightly-2024-12-01
        run: |
          configured_toolchain=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)
          if [[ "$configured_toolchain" != "$EXPECTED_TOOLCHAIN" ]]; then
            echo "::error::contracts/rust-toolchain.toml must pin $EXPECTED_TOOLCHAIN to match Contract CI."
            exit 1
          fi

          if ! grep -Eq '^[[:space:]]*targets[[:space:]]*=.*"wasm32-unknown-unknown"' rust-toolchain.toml; then
            echo "::error::contracts/rust-toolchain.toml must include the wasm32-unknown-unknown target."
            exit 1
          fi

          if [[ ! -s Cargo.lock ]]; then
            echo "::error::contracts/Cargo.lock is missing or empty; locked tests require a committed lockfile."
            exit 1
          fi

          if ! grep -Eq 'crate-type[[:space:]]*=.*"cdylib"' Cargo.toml; then
            echo "::error::contracts/Cargo.toml must declare a cdylib crate type to produce the WASM contract."
            exit 1
          fi

      - name: Test binding generation validation and rollback
        run: bash ../scripts/test-generate-contract-bindings.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2024-12-01
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check contract formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (contracts)
        working-directory: contracts
        run: |
          cargo audit --json > cargo-audit-report.json || true
          cargo audit

      - name: Upload cargo audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: contracts/cargo-audit-report.json
          retention-days: 30

      - name: Run contract tests
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --locked

      - name: Build WASM binary and report size
        run: |
          cargo build --target wasm32-unknown-unknown --release
          WASM_FILE="target/wasm32-unknown-unknown/release/stellar_stream.wasm"
          if [[ ! -s "$WASM_FILE" ]]; then
            echo "::error::WASM build completed without producing a non-empty $WASM_FILE artifact."
            exit 1
          fi
          SIZE=$(wc -c < "$WASM_FILE")
          echo "WASM Binary Size: ${SIZE} bytes ($(numfmt --to=iec ${SIZE}))"
          echo "## WASM Binary Size" >> $GITHUB_STEP_SUMMARY
          echo "**$(numfmt --to=iec ${SIZE})** (${SIZE} bytes)" >> $GITHUB_STEP_SUMMARY