name: Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  playwright-e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium browser
        working-directory: frontend
        run: npx playwright install chromium

      - name: Create backend env file for CI
        run: |
          # Generate a throwaway Stellar seed for this run only (never
          # committed) — NODE_ENV=production requires SERVER_SIGNING_KEY to
          # be set (see src/services/auth.ts), but nothing on-chain is
          # actually signed with it since SOROBAN_DISABLED=true.
          SERVER_SIGNING_KEY=$(node -e "
          const crypto = require('crypto');
          function crc16xmodem(buf) {
            let crc = 0x0000;
            for (const byte of buf) {
              crc ^= byte << 8;
              for (let i = 0; i < 8; i++) {
                crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
                crc &= 0xffff;
              }
            }
            return crc;
          }
          function base32Encode(buf) {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            let bits = 0, value = 0, output = '';
            for (const byte of buf) {
              value = (value << 8) | byte;
              bits += 8;
              while (bits >= 5) {
                output += alphabet[(value >>> (bits - 5)) & 31];
                bits -= 5;
              }
            }
            if (bits > 0) output += alphabet[(value << (5 - bits)) & 31];
            return output;
          }
          const versioned = Buffer.concat([Buffer.from([0x90]), crypto.randomBytes(32)]);
          const checksum = crc16xmodem(versioned);
          const full = Buffer.concat([versioned, Buffer.from([checksum & 0xff, (checksum >> 8) & 0xff])]);
          console.log(base32Encode(full));
          ")
          cat > backend/.env <<EOF
          PORT=3001
          SOROBAN_DISABLED=true
          ALLOWED_ASSETS=USDC,XLM
          NODE_ENV=production
          JWT_SECRET=e2e-ci-only-jwt-secret-not-used-in-production
          SERVER_SIGNING_KEY=$SERVER_SIGNING_KEY
          EOF

      - name: Start Docker Compose stack
        run: |
          docker compose -f docker-compose.yml down --volumes --remove-orphans || true
          docker compose -f docker-compose.yml up -d --build

      - name: Wait for backend health and frontend readiness
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:3001/api/health >/dev/null && curl --silent --fail http://localhost:3000 >/dev/null; then
              echo "Stack is ready";
              exit 0;
            fi;
            echo "Waiting for services to become ready... ($i/30)";
            sleep 5;
          done;
          echo "Services did not become ready in time.";
          docker compose -f docker-compose.yml ps;
          docker compose -f docker-compose.yml logs --no-color --tail=100;
          exit 1

      - name: Run Playwright tests
        id: playwright-tests
        working-directory: frontend
        run: npm run test:e2e
        continue-on-error: true

      - name: Upload Playwright HTML report on failure
        if: always() && steps.playwright-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Fail workflow if Playwright failed
        if: always() && steps.playwright-tests.outcome != 'success'
        run: |
          echo "Playwright E2E tests failed."
          exit 1

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose -f docker-compose.yml down --volumes --remove-orphans
