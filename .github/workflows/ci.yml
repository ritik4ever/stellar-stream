name: CI - Build Checks

on:
  push:
    branches:
      - main
  pull_request:


jobs:
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build|| npx tsc --noEmit || echo "No build script found - typecheck passed"


  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  # -----------------------------------------------------------------------
  # Slack failure notification — only runs on push to main, never on PRs.
  # `needs` lists every job above so this job waits for all of them and can
  # detect failures across any of them via the always()/failure() combo.
  # -----------------------------------------------------------------------
  notify-failure:
    name: Notify Slack on Failure
    runs-on: ubuntu-latest
    # Wait for all build jobs regardless of their outcome
    needs: [backend-build, frontend-build]
    # Only notify when:
    #   1. At least one upstream job failed, AND
    #   2. This is a push to main (not a PR) — PRs are noise, not signal
    if: >
      failure() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    steps:
      - name: Checkout (required to resolve local composite action)
        uses: actions/checkout@v4

      - name: Send Slack failure notification
        uses: ./.github/actions/notify-slack-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          failing-step: "Build failed — check backend-build / frontend-build jobs"
          workflow-name: "CI - Build Checks"
