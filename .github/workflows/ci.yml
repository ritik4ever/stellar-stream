name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd backend && npm ci --legacy-peer-deps
      - name: TypeScript check
        run: cd backend && npx tsc --noEmit
      - name: ESLint
        run: cd backend && npx eslint . --max-warnings=0
      - name: Jest tests
        run: cd backend && npm test -- --coverage --ci
      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd frontend && npm ci --legacy-peer-deps
      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit
      - name: ESLint
        run: cd frontend && npx eslint . --max-warnings=0
      - name: Vitest tests
        run: cd frontend && npx vitest run --coverage
      - name: Build
        run: cd frontend && npm run build
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd frontend && npx playwright install --with-deps
      - name: Run Playwright
        run: cd frontend && npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
  compose-startup-script:
    name: Compose Startup Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/compose-up.test.sh
  contracts-test:
    name: Contracts Cargo Test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Cargo test
        run: cd contracts && cargo test --all-features
      - name: Upload contracts coverage
        uses: codecov/codecov-action@v4
        with:
          files: contracts/target/coverage/lcov.info
          flags: contracts
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, e2e, compose-startup-script]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs were cancelled"
            exit 1
          fi
          echo "All required jobs passed"
