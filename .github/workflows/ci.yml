name: CI
on: [push, pull_request]
jobs:
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd backend && npm ci --legacy-peer-deps && (npm run build || npx tsc --noEmit || true)
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd frontend && npm ci --legacy-peer-deps && npm run build
  compose-startup-script:
    name: Compose Startup Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/compose-up.test.sh
  deployment-config-smoke:
    name: Deployment Config Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-deployment.test.sh
  e2e-run-script:
    name: E2E Run Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/e2e-run.test.sh
