  # CI job to check contract bindings drift after deployment
  # This job runs after contract deployment and smoke tests

name: CI - Contract Bindings Drift Check

on:
  workflow_run:
    workflows: ["CI - Build Checks"]
    types:
      - completed

jobs:
  check-bindings-drift:
    name: Check Contract Bindings Drift
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate contract bindings
        env:
          CONTRACT_ID_SECRET: ${{ secrets.CONTRACT_ID }}
        run: |
          set -euo pipefail

          contract_id="${CONTRACT_ID_SECRET:-}"
          if [[ -z "$contract_id" && -s contracts/contract_id.txt ]]; then
            contract_id="$(tr -d '[:space:]' < contracts/contract_id.txt)"
          fi

          if [[ ! "$contract_id" =~ ^C[A-Z2-7]{55}$ ]]; then
            echo "::error::Set a valid CONTRACT_ID repository secret or provide contracts/contract_id.txt."
            exit 1
          fi

          echo "::add-mask::$contract_id"
          CONTRACT_ID="$contract_id" npm run gen:bindings

      - name: Check for uncommitted changes in generated bindings
        run: |
          if [[ -n $(git status --porcelain frontend/src/contracts/generated) ]]; then
            echo "::error::Run npm run gen:bindings and commit the result. Stale contract bindings detected."
            git --no-pager diff frontend/src/contracts/generated
            exit 1
          fi
          echo "Bindings are up to date."
