# CI job to check contract bindings drift after deployment
# This job runs after contract deployment and smoke tests

name: CI - Contract Bindings Drift Check

on:
  workflow_run:
    workflows: ["CI - Build Checks"]
    types:
      - completed

jobs:
  check-bindings-drift:
    name: Check Contract Bindings Drift
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      toolchain_mismatch: ${{ steps.detect-toolchain.outputs.mismatch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Detect Rust toolchain mismatch
        id: detect-toolchain
        run: |
          set -euo pipefail
          if [[ -f rust-toolchain.toml ]]; then
            EXPECTED=$(grep -E '^channel' rust-toolchain.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            ACTUAL=$(rustc --version 2>/dev/null | awk '{print $2}' || echo "none")
            if [[ -n "${EXPECTED}" && "${EXPECTED}" != "${ACTUAL}" ]]; then
              echo "::warning::Rust toolchain mismatch: expected ${EXPECTED}, found ${ACTUAL}"
              echo "mismatch=true" >> "$GITHUB_OUTPUT"
            else
              echo "mismatch=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mismatch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate contract bindings
        env:
          CONTRACT_ID: ${{ secrets.CONTRACT_ID || format('cat contracts/contract_id.txt') }}
        if: ${{ steps.detect-toolchain.outputs.mismatch != 'true' }}
        run: npm run gen:bindings

      - name: Check for uncommitted changes in generated bindings
        run: |
          if [[ -n $(git status --porcelain frontend/src/contracts/generated) ]]; then
            echo "::error::Run npm run gen:bindings and commit the result. Stale contract bindings detected."
            git --no-pager diff frontend/src/contracts/generated
            exit 1
          fi
          echo "Bindings are up to date."

      - name: Rollback on toolchain mismatch
        if: ${{ steps.detect-toolchain.outputs.mismatch == 'true' }}
        run: |
          echo "::error::Rust toolchain mismatch detected. Skipping bindings generation."
          echo "Rollback: pin rust-toolchain.toml to the CI-installed toolchain and re-run this workflow."
          exit 1
          echo "Bindings are up to date."
