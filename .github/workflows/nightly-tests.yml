name: Nightly Tests

on:
  schedule:
    # Run nightly at 02:00 UTC (offset from contract-smoke at 00:00 to avoid
    # concurrent runner contention and spread any flaky failure signals)
    - cron: '0 2 * * *'
  # Allow manual re-runs from the Actions tab for quick debugging
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Backend: type-check, lint, and full unit-test suite with coverage
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests (nightly)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npx vitest run --coverage --coverage.thresholds.lines=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-nightly
          path: backend/coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Frontend: type-check, lint, and full unit-test suite with coverage
  # ---------------------------------------------------------------------------
  frontend-tests:
    name: Frontend Tests (nightly)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm test -- --run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-nightly
          path: frontend/coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Slack notification — fires only when at least one test job has failed.
  # Scheduled runs have no PR context, so we skip the event-type guard used
  # in ci.yml; every nightly failure is worth notifying.
  # ---------------------------------------------------------------------------
  notify-failure:
    name: Notify Slack on Failure
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: failure()
    steps:
      - name: Checkout (required to resolve local composite action)
        uses: actions/checkout@v4

      - name: Send Slack failure notification
        uses: ./.github/actions/notify-slack-failure
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          failing-step: "Nightly test suite failed — check backend-tests / frontend-tests jobs"
          workflow-name: "Nightly Tests"
