<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StellarStream - Real-Time Payment Streaming</title>
    <!--
      Anti-FOUC: apply the resolved theme before first paint.
      Reads localStorage preference (light/dark/system),
      falls
      back to prefers-color-scheme.
    -->
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem('stellar-stream-theme');
          if (stored === 'dark' || stored === 'light') {
            theme = stored;
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            theme = 'dark';
          }
        } catch (_) {
          if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            theme = 'dark';
          }
        }
        var root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        root.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
