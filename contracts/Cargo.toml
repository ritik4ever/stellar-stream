[package]
name = "stellar-stream"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `testutils` mirrors the lenient token-allowlist behavior used in tests
# (see the `#[cfg(any(test, feature = "testutils"))]` branches in lib.rs).
testutils = []
# `proptest` gates the property-based tests in src/tests/property_tests.rs:
#   cargo test --features proptest
proptest = ["dep:proptest"]

[dependencies]
soroban-sdk = "21.0.0"
# Optional so it is only compiled when the `proptest` feature is enabled
# (Cargo does not allow optional dev-dependencies). It is only referenced
# from `src/tests/property_tests.rs`, which is gated on cfg(test).
proptest = { version = "1", optional = true }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
insta = { version = "1.34.0", features = ["yaml"] }

# `testutils` is a soroban-sdk feature, not a feature of this crate; declare it
# so `cargo clippy -- -D warnings` does not treat the cfg as unexpected.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("testutils"))'] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
