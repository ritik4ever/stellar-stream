[package]
name = "stellar-stream"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
insta = { version = "1.34.0", features = ["yaml"] }

# `testutils` is a soroban-sdk feature, not a feature of this crate; declare it
# so `cargo clippy -- -D warnings` does not treat the cfg as unexpected.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("testutils"))'] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
